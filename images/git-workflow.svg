<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4e008e"/>
    </marker>
  </defs>

  <!-- PC -->
  <rect x="20" y="70" width="170" height="80" rx="10" fill="#efe6f7" stroke="#4e008e" stroke-width="2"/>
  <text x="105" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2330">My PC</text>
  <text x="105" y="125" text-anchor="middle" font-size="13" fill="#5b6475">edit HTML · git commit</text>

  <!-- GitHub -->
  <rect x="300" y="15" width="190" height="70" rx="10" fill="#f6f7f9" stroke="#1d2330" stroke-width="2"/>
  <text x="395" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2330">GitHub</text>
  <text x="395" y="67" text-anchor="middle" font-size="13" fill="#5b6475">git push origin main</text>

  <!-- Homepages -->
  <rect x="300" y="135" width="190" height="70" rx="10" fill="#f6f7f9" stroke="#1d2330" stroke-width="2"/>
  <text x="395" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2330">homepages.tuni.fi</text>
  <text x="395" y="187" text-anchor="middle" font-size="13" fill="#5b6475">git push tuni main</text>

  <!-- Browser -->
  <rect x="580" y="135" width="160" height="70" rx="10" fill="#4e008e"/>
  <text x="660" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Web browser</text>
  <text x="660" y="187" text-anchor="middle" font-size="13" fill="#e6d9f2">Apache serves pages</text>

  <!-- Arrows -->
  <line x1="190" y1="95" x2="298" y2="55" stroke="#4e008e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="190" y1="125" x2="298" y2="165" stroke="#4e008e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="490" y1="170" x2="578" y2="170" stroke="#4e008e" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
